name: LuST Legacy MAPPO Residual

on:
  workflow_run:
    workflows: ["LuST Legacy Dataset and GRU"]
    types: [completed]

jobs:
  mappo:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-22.04
    env:
      SUMO_HOME: ${{ github.workspace }}/legacy_sumo_repo/sumo
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lust-dynamic-coalition-exp-20260928

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool pkg-config libxerces-c-dev git python3 python3-pip
          python3 -m pip install --user numpy
          python3 -m pip install --user torch --index-url https://download.pytorch.org/whl/cpu

      - name: Download legacy dataset/GRU artifact
        uses: actions/download-artifact@v4
        with:
          name: lust-legacy-sumo027-dataset-gru
          path: upstream
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Build pinned SUMO 0.27.0
        run: |
          git clone --depth 1 --branch v0_27_0 https://github.com/eclipse-sumo/sumo.git legacy_sumo_repo
          cd legacy_sumo_repo/sumo
          sed -i 's/\bHUGE\b/HUGE_VAL/g' src/foreign/eulerspiral/BiArc.cpp
          sed -i 's/typemap\.iteritems()/typemap.items()/g' tools/build/typemap.py
          make -f Makefile.cvs
          ./configure --with-proj-gdal=no --with-fox-config=no --with-gtest-config=no --with-python=no --with-osg=no CXXFLAGS="-O2 -std=gnu++11"
          make -j2
          ./bin/sumo --version | tee ../../sumo027_version.txt

      - name: Pin official LuST v2.0
        run: |
          git clone https://github.com/lcodeca/LuSTScenario.git official_lust
          git -C official_lust checkout c4bd5bd3751d426d42a9a1749c815e47ea188549

      - name: Train and evaluate guarded residual MAPPO
        run: |
          mkdir -p legacy_mappo
          python3 research/lust_dynamic_coalition/train_mappo_legacy_residual.py \
            --sumo "$GITHUB_WORKSPACE/legacy_sumo_repo/sumo/bin/sumo" \
            --sumo-tools "$GITHUB_WORKSPACE/legacy_sumo_repo/sumo/tools" \
            --scenario "$GITHUB_WORKSPACE/official_lust/scenario" \
            --selection "$GITHUB_WORKSPACE/upstream/selected_9_tls.csv" \
            --windows "$GITHUB_WORKSPACE/upstream/selected_operating_windows.csv" \
            --outdir "$GITHUB_WORKSPACE/legacy_mappo" \
            --episodes 32 --train-s 900 --eval-s 1800 \
            --eval-seeds 9001,9002,9003 --seed 42

      - name: Pilot improvement guard
        run: |
          python3 - <<'PY'
          import csv,collections,sys
          rows=list(csv.DictReader(open("legacy_mappo/evaluation_summary.csv")))
          d={(r["controller"],r["condition"]):r for r in rows}
          metrics=["mean_halting_vehicles_mean","mean_waiting_time_lane_sum_s_mean","CO2_kg_selected_approaches_mean"]
          improvements=0
          for cond in sorted({r["condition"] for r in rows}):
              a=d[("Actuated",cond)];m=d[("MAPPO-residual",cond)]
              for key in metrics:
                  av=float(a[key]);mv=float(m[key]);rel=(av-mv)/max(abs(av),1e-9)
                  print(cond,key,rel)
                  if rel>0: improvements+=1
                  assert rel>=-0.10, f"{cond} {key} degraded more than 10%: {rel}"
          assert improvements>0,"No metric improved over native actuated control"
          PY

      - name: Preserve provenance
        if: always()
        run: |
          cp upstream/selected_9_tls.csv legacy_mappo/ 2>/dev/null || true
          cp upstream/selected_operating_windows.csv legacy_mappo/ 2>/dev/null || true
          cp upstream/gru/gru_v2_validation.json legacy_mappo/ 2>/dev/null || true
          cp sumo027_version.txt legacy_mappo/ 2>/dev/null || true
          echo c4bd5bd3751d426d42a9a1749c815e47ea188549 > legacy_mappo/official_lust_commit.txt
          echo 7eac6a1b2543aa902fa2eff8ae82548eaa4cce6b > legacy_mappo/sumo_tag_commit.txt

      - name: Upload legacy MAPPO
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lust-legacy-sumo027-mappo-residual
          path: legacy_mappo/
          if-no-files-found: warn
          retention-days: 30
