name: LuST Stakeholder Final Multi-Condition Robustness
# Publication-grade frozen-policy test: calibrated deploy margin 0.15; disjoint CRN test seeds.
on:
  workflow_dispatch:
  push:
    branches: [lust-dynamic-coalition-exp-20260928]
    paths:
      - '.github/workflows/lust-stakeholder-final-multicondition.yml'
jobs:
  evaluate:
    strategy:
      fail-fast: false
      matrix:
        condition: [Off-peak, AM, Lunch, PM]
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with: {ref: lust-dynamic-coalition-exp-20260928}
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential cmake libxerces-c-dev libfox-1.6-dev libgdal-dev libproj-dev python3-pip
          python3 -m pip install --user numpy torch
      - name: Inputs and frozen checkpoint
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          mkdir phase2 checkpoint
          gh run download 36892215405 -n lust-legacy-phase2-dataset-gru-mappo -D phase2
          gh run download 37365908442 -n stakeholder-mappo-smoke -D checkpoint
          test -s phase2/selected_9_tls.csv
          test -s phase2/selected_operating_windows.csv
          test -s checkpoint/stakeholder_mappo.pt
      - name: Build pinned SUMO and LuST
        run: |
          git clone --depth 1 --branch v0_27_0 https://github.com/eclipse-sumo/sumo.git legacy_sumo_repo
          cd legacy_sumo_repo/sumo
          test "$(git rev-parse HEAD)" = "7eac6a1b2543aa902fa2eff8ae82548eaa4cce6b"
          sed -i 's/\bHUGE\b/HUGE_VAL/g' src/foreign/eulerspiral/BiArc.cpp
          sed -i 's/typemap\.iteritems()/typemap.items()/g' tools/build/typemap.py
          make -f Makefile.cvs
          ./configure --with-proj-gdal=no --with-fox-config=no --with-gtest-config=no --with-python=no --with-osg=no CXXFLAGS="-O2 -std=gnu++11"
          make -j2
          cd "$GITHUB_WORKSPACE"
          git clone https://github.com/lcodeca/LuSTScenario.git official_lust
          git -C official_lust checkout c4bd5bd3751d426d42a9a1749c815e47ea188549
      - name: Evaluate condition
        env: {SUMO_HOME: "${{ github.workspace }}/legacy_sumo_repo/sumo"}
        run: |
          python3 research/lust_dynamic_coalition/evaluate_stakeholder_coalitions_legacy.py \
            --sumo "$SUMO_HOME/bin/sumo" --sumo-tools "$SUMO_HOME/tools" \
            --scenario "$GITHUB_WORKSPACE/official_lust/scenario" \
            --selection "$GITHUB_WORKSPACE/phase2/selected_9_tls.csv" \
            --windows "$GITHUB_WORKSPACE/phase2/selected_operating_windows.csv" \
            --checkpoint "$GITHUB_WORKSPACE/checkpoint/stakeholder_mappo.pt" \
            --outdir final_result --condition "${{ matrix.condition }}" --eval-s 900 \
            --seeds 9101,9102,9103,9104,9105 --deploy-margin 0.15
      - name: Condition gate
        run: |
          python3 - <<'PY'
          import csv,json
          r=list(csv.DictReader(open("final_result/coalition_results.csv")))
          p=json.load(open("final_result/provenance.json"))
          assert len(r)==70 and len({x["coalition"] for x in r})==14
          assert p["seeds"]==[9101,9102,9103,9104,9105] and p["deploy_margin"]==0.15
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-condition-${{ matrix.condition }}
          path: final_result/
          retention-days: 30
  aggregate:
    needs: evaluate
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: final-condition-*
          path: condition_artifacts
      - name: Verify and combine
        run: |
          python3 - <<'PY'
          import csv,json,pathlib
          root=pathlib.Path("condition_artifacts")
          conds=["Off-peak","AM","Lunch","PM"]; rows=[]; baselines=[]
          for c in conds:
              d=root/("final-condition-"+c)
              r=list(csv.DictReader(open(d/"coalition_results.csv")))
              n=list(csv.DictReader(open(d/"native_baselines.csv")))
              p=json.load(open(d/"provenance.json"))
              assert len(r)==70 and len(n)==5 and p["condition"]==c
              assert p["deploy_margin"]==0.15 and p["seeds"]==[9101,9102,9103,9104,9105]
              assert len({x["coalition"] for x in r})==14 and len({x["seed"] for x in r})==5
              rows+=r; baselines+=n
          assert len(rows)==280 and len(baselines)==20
          for name,data in [("final_all_conditions.csv",rows),("final_native_baselines.csv",baselines)]:
              with open(name,"w",newline="") as f:
                  w=csv.DictWriter(f,fieldnames=list(data[0]));w.writeheader();w.writerows(data)
          json.dump({"conditions":conds,"seeds":[9101,9102,9103,9104,9105],"deploy_margin":0.15,"coalition_evaluations":280,"native_runs":20,"frozen":True},open("final_provenance.json","w"),indent=2)
          print("PASS: 280 coalition evaluations and 20 native baselines")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stakeholder-final-multicondition-margin015
          path: |
            final_all_conditions.csv
            final_native_baselines.csv
            final_provenance.json
          retention-days: 30
