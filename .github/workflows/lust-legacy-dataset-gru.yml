name: LuST Legacy Dataset and GRU

on:
  workflow_run:
    workflows: ["LuST Legacy TLS Selection"]
    types: [completed]

jobs:
  dataset-gru:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-22.04
    env:
      SUMO_HOME: ${{ github.workspace }}/legacy_sumo_repo/sumo
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lust-dynamic-coalition-exp-20260928

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool pkg-config libxerces-c-dev git python3 python3-pip
          python3 -m pip install --user numpy
          python3 -m pip install --user torch --index-url https://download.pytorch.org/whl/cpu

      - name: Download legacy TLS selection
        uses: actions/download-artifact@v4
        with:
          name: lust-legacy-sumo027-tls-selection
          path: selection
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Audit selected TLS and operating windows
        run: |
          python3 research/lust_dynamic_coalition/audit_legacy_selection.py --dir selection

      - name: Build pinned SUMO 0.27.0
        run: |
          git clone --depth 1 --branch v0_27_0 https://github.com/eclipse-sumo/sumo.git legacy_sumo_repo
          cd legacy_sumo_repo/sumo
          sed -i 's/\bHUGE\b/HUGE_VAL/g' src/foreign/eulerspiral/BiArc.cpp
          sed -i 's/typemap\.iteritems()/typemap.items()/g' tools/build/typemap.py
          make -f Makefile.cvs
          ./configure --with-proj-gdal=no --with-fox-config=no --with-gtest-config=no --with-python=no --with-osg=no CXXFLAGS="-O2 -std=gnu++11"
          make -j2
          ./bin/sumo --version | tee ../../sumo027_version.txt

      - name: Pin official LuST v2.0
        run: |
          git clone https://github.com/lcodeca/LuSTScenario.git official_lust
          git -C official_lust checkout c4bd5bd3751d426d42a9a1749c815e47ea188549

      - name: Collect 10-second nine-TLS dataset
        run: |
          mkdir -p legacy_dataset_gru
          python3 research/lust_dynamic_coalition/collect_legacy_tls_dataset.py \
            --sumo "$GITHUB_WORKSPACE/legacy_sumo_repo/sumo/bin/sumo" \
            --sumo-tools "$GITHUB_WORKSPACE/legacy_sumo_repo/sumo/tools" \
            --scenario "$GITHUB_WORKSPACE/official_lust/scenario" \
            --selection "$GITHUB_WORKSPACE/selection/selected_9_tls.csv" \
            --output "$GITHUB_WORKSPACE/legacy_dataset_gru/legacy_9tls_state_10s.csv" \
            --seed 42

      - name: Train residual GRU and compare with persistence
        run: |
          python3 research/lust_dynamic_coalition/train_gru_v2_residual.py \
            --data legacy_dataset_gru/legacy_9tls_state_10s.csv \
            --outdir legacy_dataset_gru/gru \
            --epochs 40 --patience 7 --seed 42

      - name: Preserve provenance
        if: always()
        run: |
          cp selection/selected_9_tls.csv legacy_dataset_gru/ 2>/dev/null || true
          cp selection/selected_operating_windows.csv legacy_dataset_gru/ 2>/dev/null || true
          cp selection/selection_metadata.json legacy_dataset_gru/ 2>/dev/null || true
          cp sumo027_version.txt legacy_dataset_gru/ 2>/dev/null || true
          echo c4bd5bd3751d426d42a9a1749c815e47ea188549 > legacy_dataset_gru/official_lust_commit.txt
          echo 7eac6a1b2543aa902fa2eff8ae82548eaa4cce6b > legacy_dataset_gru/sumo_tag_commit.txt

      - name: Upload legacy dataset and GRU
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lust-legacy-sumo027-dataset-gru
          path: legacy_dataset_gru/
          if-no-files-found: warn
          retention-days: 30
