name: Real LuST Stage3 MAPPO Pilot

on:
  workflow_run:
    workflows: ["Real LuST Stage2 GRU"]
    types: [completed]

jobs:
  mappo-pilot:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout experiment branch
        uses: actions/checkout@v4
        with:
          ref: lust-dynamic-coalition-exp-20260928

      - name: Install SUMO and PyTorch
        run: |
          sudo apt-get update
          sudo apt-get install -y sumo sumo-tools git python3-pip
          python3 -m pip install --break-system-packages numpy
          python3 -m pip install --break-system-packages torch --index-url https://download.pytorch.org/whl/cpu

      - name: Download Stage2 real-data artifact
        uses: actions/download-artifact@v4
        with:
          name: real-lust-stage2-gru-results
          path: stage2_results
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Fetch official LuST v2.0
        run: |
          git clone --depth 1 --branch v2.0 https://github.com/lcodeca/LuSTScenario.git official_lust
          git -C official_lust rev-parse HEAD
          sumo --version | head -n 3

      - name: Train real nine-agent MAPPO pilot
        run: |
          mkdir -p stage3_results
          python3 research/lust_dynamic_coalition/train_mappo_real_lust.py             --scenario official_lust/scenario             --selection stage2_results/selected_9_tls.csv             --windows stage2_results/selected_operating_windows.csv             --outdir stage3_results             --episodes 12             --train-control-s 600             --eval-control-s 1800             --eval-seeds 9001,9002             --seed 42

      - name: Preserve provenance
        if: always()
        run: |
          cp stage2_results/selected_9_tls.csv stage3_results/ 2>/dev/null || true
          cp stage2_results/selected_operating_windows.csv stage3_results/ 2>/dev/null || true
          cp stage2_results/gru/gru_validation.json stage3_results/ 2>/dev/null || true
          cp stage2_results/gru/gru_queue60s.pt stage3_results/ 2>/dev/null || true
          cp stage2_results/gru/gru_training_history.csv stage3_results/ 2>/dev/null || true
          git -C official_lust rev-parse HEAD > stage3_results/official_lust_commit.txt || true
          sumo --version > stage3_results/sumo_version.txt || true

      - name: Upload MAPPO pilot artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-lust-stage3-mappo-pilot
          path: stage3_results/
          if-no-files-found: warn
          retention-days: 30
