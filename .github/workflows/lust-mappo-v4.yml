name: LuST MAPPO v4 True-Extension Guarded
on:
  workflow_dispatch:
  push:
    branches: [lust-dynamic-coalition-exp-20260928]
    paths:
      - 'research/lust_dynamic_coalition/train_mappo_v4_residual.py'
      - '.github/workflows/lust-mappo-v4.yml'
jobs:
  pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Compile guard
        run: python -m py_compile research/lust_dynamic_coalition/train_mappo_v4_residual.py
      - name: Install pinned runtime
        run: |
          sudo apt-get update && sudo apt-get install -y sumo sumo-tools
          pip install numpy torch
          sumo --version | head -n1 | grep -F "1.18.0"
      - name: Pin LuST
        run: |
          git clone https://github.com/lcodeca/LuSTScenario.git official_lust
          git -C official_lust checkout c4bd5bd3751d426d42a9a1749c815e47ea188549
          test "$(git -C official_lust rev-parse HEAD)" = "c4bd5bd3751d426d42a9a1749c815e47ea188549"
      - name: Baseline inputs
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          mkdir baseline
          gh run download 36567745991 -n real-lust-v2-baseline-results -D baseline
      - name: Execution sanity guard
        run: |
          rm -rf sanity
          python research/lust_dynamic_coalition/train_mappo_v4_residual.py --scenario official_lust/scenario \
            --selection baseline/selected_9_tls.csv --windows baseline/selected_operating_windows.csv \
            --outdir sanity --episodes 2 --train-control-s 120 --eval-control-s 120 --eval-seeds 9199 --seed 42
          test -s sanity/training_history.csv
          test -s sanity/evaluation_raw.csv
          test -s sanity/evaluation_summary.csv
          test -s sanity/run_metadata.json
          test "$(($(wc -l < sanity/evaluation_raw.csv)-1))" -eq 8
      - name: MAPPO-v4 pilot
        run: |
          python research/lust_dynamic_coalition/train_mappo_v4_residual.py --scenario official_lust/scenario             --selection baseline/selected_9_tls.csv --windows baseline/selected_operating_windows.csv             --outdir pilot --episodes 48 --train-control-s 600 --eval-control-s 900             --eval-seeds 9101,9102,9103 --seed 42
      - name: Pilot integrity and improvement gate
        run: |
          python - <<'PY'
          import csv,math
          r=list(csv.DictReader(open("pilot/evaluation_raw.csv")))
          assert len(r)==24
          m=[x for x in r if x['controller']=='MAPPO']
          assert all(float(x.get('intervention_rate',0)) <= 0.35 for x in m)
          assert sum(float(x.get('action_requests',0)) for x in m)>0, "Policy never requested residual control"
          assert sum(float(x.get('eligible_requests',0)) for x in m)>0, "Supervisory gate never opened"
          assert sum(float(x.get('interventions',0)) for x in m)>0, "No residual action reached SUMO"
          for x in r:
            for k in ["mean_halting_vehicles","mean_waiting_time_lane_sum_s","arrived_vehicles","CO2_kg_selected_approaches","mean_reward"]:
              assert math.isfinite(float(x[k]))
          # Gate on aggregate queue/wait: residual policy must show at least one improvement
          # and may not degrade the other by >10% before expensive full training.
          def mean(ctrl,k):
            z=[float(x[k]) for x in r if x["controller"]==ctrl]; return sum(z)/len(z)
          bh,bw=mean("Actuated","mean_halting_vehicles"),mean("Actuated","mean_waiting_time_lane_sum_s")
          mh,mw=mean("MAPPO","mean_halting_vehicles"),mean("MAPPO","mean_waiting_time_lane_sum_s")
          dh=(mh/bh-1)*100; dw=(mw/bw-1)*100
          print({"halting_pct":dh,"waiting_pct":dw})
          assert min(dh,dw)<0, "No pilot improvement over actuated baseline"
          assert max(dh,dw)<=5, "Pilot degradation exceeds 5% guard"
          PY
      - name: Upload pilot
        if: always()
        uses: actions/upload-artifact@v4
        with: {name: lust-mappo-v4-true-extension-pilot, path: pilot/, retention-days: 30}
  full:
    needs: pilot
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Install runtime and pin LuST
        run: |
          sudo apt-get update && sudo apt-get install -y sumo sumo-tools
          pip install numpy torch
          sumo --version | head -n1 | grep -F "1.18.0"
          git clone https://github.com/lcodeca/LuSTScenario.git official_lust
          git -C official_lust checkout c4bd5bd3751d426d42a9a1749c815e47ea188549
      - name: Baseline inputs
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          mkdir baseline
          gh run download 36567745991 -n real-lust-v2-baseline-results -D baseline
      - name: Full MAPPO-v4
        run: |
          python research/lust_dynamic_coalition/train_mappo_v4_residual.py --scenario official_lust/scenario             --selection baseline/selected_9_tls.csv --windows baseline/selected_operating_windows.csv             --outdir full --episodes 160 --train-control-s 900 --eval-control-s 3600             --eval-seeds 9201,9202,9203,9204,9205 --seed 42
      - name: Full integrity
        run: |
          python - <<'PY'
          import csv,math
          r=list(csv.DictReader(open("full/evaluation_raw.csv"))); assert len(r)==40
          assert len({x["seed"] for x in r})==5
          assert {x["condition"] for x in r}=={"Off-peak","AM","Lunch","PM"}
          assert {x["controller"] for x in r}=={"Actuated","MAPPO"}
          for x in r:
            for k in ["mean_halting_vehicles","mean_waiting_time_lane_sum_s","arrived_vehicles","CO2_kg_selected_approaches","mean_reward"]:
              assert math.isfinite(float(x[k]))
          PY
      - name: Provenance
        if: always()
        run: |
          echo c4bd5bd3751d426d42a9a1749c815e47ea188549 > full/official_lust_commit.txt
          sumo --version | head -n1 > full/sumo_version.txt
          echo "baseline_run=36567745991" > full/provenance.txt
          echo "GRU_v2_run=36710444029; EC=persistence forecast" >> full/provenance.txt
          echo "MAPPO_v1_run=36711984657; v2=residual native-control policy" >> full/provenance.txt
      - name: Upload full
        if: always()
        uses: actions/upload-artifact@v4
        with: {name: lust-mappo-v4-true-extension-5seed-results, path: full/, retention-days: 30}
