name: LuST Legacy Phase2 Dataset GRU MAPPO

on:
  push:
    branches: [lust-dynamic-coalition-exp-20260928]
    paths:
      - '.github/workflows/lust-legacy-phase2.yml'
  workflow_dispatch:

jobs:
  phase2:
    runs-on: ubuntu-22.04
    env:
      SUMO_HOME: ${{ github.workspace }}/legacy_sumo_repo/sumo
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool pkg-config libxerces-c-dev git python3 python3-pip
          python3 -m pip install --user numpy scipy matplotlib
          python3 -m pip install --user torch --index-url https://download.pytorch.org/whl/cpu

      - name: Download validated legacy TLS selection
        uses: actions/download-artifact@v4
        with:
          name: lust-legacy-sumo027-tls-selection
          path: selection
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 36886453568

      - name: Guard selected TLS provenance
        run: |
          test "$(cat selection/official_lust_commit.txt)" = "c4bd5bd3751d426d42a9a1749c815e47ea188549"
          grep -F "SUMO Version 0.27.0" selection/sumo027_version.txt
          python3 - <<'PY'
          import csv
          rows=list(csv.DictReader(open("selection/selected_9_tls.csv")))
          assert len(rows)==9
          assert len({r["tls_id"] for r in rows})==9
          print("Selected TLS:",[(r["agent_alias"],r["tls_id"]) for r in rows])
          PY

      - name: Build pinned SUMO 0.27.0
        run: |
          git clone --depth 1 --branch v0_27_0 https://github.com/eclipse-sumo/sumo.git legacy_sumo_repo
          cd legacy_sumo_repo/sumo
          sed -i 's/\bHUGE\b/HUGE_VAL/g' src/foreign/eulerspiral/BiArc.cpp
          sed -i 's/typemap\.iteritems()/typemap.items()/g' tools/build/typemap.py
          make -f Makefile.cvs
          ./configure --with-proj-gdal=no --with-fox-config=no --with-gtest-config=no --with-python=no --with-osg=no CXXFLAGS="-O2 -std=gnu++11"
          make -j2
          ./bin/sumo --version | tee ../../sumo027_version.txt
          grep -F "Version 0.27.0" ../../sumo027_version.txt

      - name: Pin official LuST v2.0
        run: |
          git clone https://github.com/lcodeca/LuSTScenario.git official_lust
          git -C official_lust checkout c4bd5bd3751d426d42a9a1749c815e47ea188549
          test "$(git -C official_lust rev-parse HEAD)" = "c4bd5bd3751d426d42a9a1749c815e47ea188549"

      - name: Collect 24h 10-second nine-TLS dataset
        run: |
          mkdir -p phase2/dataset
          python3 research/lust_dynamic_coalition/collect_legacy_tls_dataset.py \
            --sumo "$GITHUB_WORKSPACE/legacy_sumo_repo/sumo/bin/sumo" \
            --sumo-tools "$GITHUB_WORKSPACE/legacy_sumo_repo/sumo/tools" \
            --scenario "$GITHUB_WORKSPACE/official_lust/scenario" \
            --selection "$GITHUB_WORKSPACE/selection/selected_9_tls.csv" \
            --output "$GITHUB_WORKSPACE/phase2/dataset/legacy_9tls_state_10s.csv" \
            --seed 42

      - name: Dataset integrity gate
        run: |
          python3 - <<'PY'
          import csv,collections
          p="phase2/dataset/legacy_9tls_state_10s.csv"
          rows=list(csv.DictReader(open(p)))
          assert len(rows)==77760, len(rows)
          by=collections.Counter(r["tls_id"] for r in rows)
          assert len(by)==9 and all(v==8640 for v in by.values()),by
          print("Dataset rows:",len(rows),"per TLS:",by)
          PY

      - name: Train residual GRU against persistence
        run: |
          mkdir -p phase2/gru
          python3 research/lust_dynamic_coalition/train_gru_v2_residual.py \
            --data phase2/dataset/legacy_9tls_state_10s.csv \
            --outdir phase2/gru \
            --epochs 40 --patience 7 --seed 42

      - name: Smoke-test deterministic replay MAPPO path
        run: |
          mkdir -p phase2/mappo_smoke
          python3 research/lust_dynamic_coalition/train_mappo_legacy_residual.py \
            --sumo "$GITHUB_WORKSPACE/legacy_sumo_repo/sumo/bin/sumo" \
            --sumo-tools "$GITHUB_WORKSPACE/legacy_sumo_repo/sumo/tools" \
            --scenario "$GITHUB_WORKSPACE/official_lust/scenario" \
            --selection "$GITHUB_WORKSPACE/selection/selected_9_tls.csv" \
            --windows "$GITHUB_WORKSPACE/selection/selected_operating_windows.csv" \
            --outdir "$GITHUB_WORKSPACE/phase2/mappo_smoke" \
            --episodes 1 --train-s 60 --eval-s 60 \
            --eval-seeds 9001 --seed 42

      - name: Train guarded residual MAPPO with deterministic replay
        run: |
          mkdir -p phase2/mappo
          python3 research/lust_dynamic_coalition/train_mappo_legacy_residual.py \
            --sumo "$GITHUB_WORKSPACE/legacy_sumo_repo/sumo/bin/sumo" \
            --sumo-tools "$GITHUB_WORKSPACE/legacy_sumo_repo/sumo/tools" \
            --scenario "$GITHUB_WORKSPACE/official_lust/scenario" \
            --selection "$GITHUB_WORKSPACE/selection/selected_9_tls.csv" \
            --windows "$GITHUB_WORKSPACE/selection/selected_operating_windows.csv" \
            --outdir "$GITHUB_WORKSPACE/phase2/mappo" \
            --episodes 24 --train-s 900 --eval-s 1800 \
            --eval-seeds 9001 --seed 42

      - name: Preserve provenance and upstream selection
        if: always()
        run: |
          cp selection/selected_9_tls.csv phase2/ 2>/dev/null || true
          cp selection/selected_operating_windows.csv phase2/ 2>/dev/null || true
          cp selection/selection_metadata.json phase2/ 2>/dev/null || true
          cp sumo027_version.txt phase2/ 2>/dev/null || true
          echo c4bd5bd3751d426d42a9a1749c815e47ea188549 > phase2/official_lust_commit.txt
          echo 7eac6a1b2543aa902fa2eff8ae82548eaa4cce6b > phase2/sumo_tag_commit.txt

      - name: Upload phase2 real results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lust-legacy-phase2-dataset-gru-mappo
          path: phase2/
          if-no-files-found: warn
          retention-days: 30
